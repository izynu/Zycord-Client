<svg xmlns="http://www.w3.org/2000/svg" width="900" height="16" viewBox="0 0 900 16" role="img" aria-label="Decorative divider">
  <title>Divider</title>

  <defs>
    <linearGradient id="dividerSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ea6bd" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7ea6bd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7ea6bd" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="0" y1="8" x2="900" y2="8" stroke="#94a3b8" stroke-opacity="0.26" stroke-width="1"/>

  <rect x="-260" y="7" width="260" height="2" fill="url(#dividerSweep)">
    <animate attributeName="x"
             values="-260;900;900"
             keyTimes="0;0.78;1"
             calcMode="spline"
             keySplines="0.42 0 0.42 1;0 0 1 1"
             dur="6s" begin="0s" repeatCount="indefinite"/>
  </rect>
</svg>
