<svg xmlns="http://www.w3.org/2000/svg" width="360" height="120" viewBox="0 0 360 120" role="img" aria-labelledby="wmTitle wmDesc">
  <title id="wmTitle">Zycord Client</title>
  <desc id="wmDesc">Zycord Client wordmark. A Z mark draws itself once per five second cycle above the caption Windows desktop client.</desc>

  <defs>
    <linearGradient id="accentSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ea6bd" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7ea6bd" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7ea6bd" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lineClip">
      <rect x="94" y="93.5" width="236" height="5"/>
    </clipPath>
  </defs>

  <rect x="2" y="26" width="68" height="68" rx="15" fill="none" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.5"/>

  <path d="M20 44 H52 L20 76 H52"
        fill="none" stroke="#64748b" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"
        pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset"
             values="100;0;0;100"
             keyTimes="0;0.16;0.84;1"
             calcMode="spline"
             keySplines="0.35 0 0.25 1;0 0 1 1;0.35 0 0.25 1"
             dur="5s" begin="0s" repeatCount="indefinite"/>
  </path>

  <text x="92" y="62" fill="#64748b" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="30" font-weight="600" letter-spacing="6">ZYCORD</text>

  <text x="94" y="84" fill="#64748b" fill-opacity="0.72"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="10.5" letter-spacing="3.6">WINDOWS DESKTOP CLIENT</text>

  <line x1="94" y1="96" x2="330" y2="96" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>

  <g clip-path="url(#lineClip)">
    <rect x="94" y="95.2" width="70" height="1.6" fill="url(#accentSweep)" opacity="0.9">
      <animate attributeName="x"
               values="94;330;330"
               keyTimes="0;0.72;1"
               calcMode="spline"
               keySplines="0.4 0 0.4 1;0 0 1 1"
               dur="5s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
