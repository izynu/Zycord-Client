<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Zycord">
  <title>Zycord</title>
  <desc>Rounded gradient app tile with a geometric Z mark.</desc>
  <defs>
    <linearGradient id="tileFill" x1="0" y1="0" x2="0.12" y2="1">
      <stop offset="0" stop-color="#2E1278"/>
      <stop offset="0.58" stop-color="#582ED6"/>
      <stop offset="1" stop-color="#1A76F6"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0.38" cy="0.24" r="0.56">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.17"/>
