  <path d="M 292.0 296.0 L 732.0 296.0 L 732.0 412.0 L 532.0 612.0 L 732.0 612.0 L 732.0 728.0 L 292.0 728.0 L 292.0 612.0 L 368.0 612.0 L 568.0 412.0 L 292.0 412.0 Z" fill="#FFFFFF" filter="url(#zShadow)"/>
